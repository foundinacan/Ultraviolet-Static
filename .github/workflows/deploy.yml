name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build scripts
        run: |
          npm install
          npm run build

      - name: Copy built scripts into public folder
        run: |
          mkdir -p public/uv public/baremux public/epoxy
          cp -r node_modules/@titaniumnetwork-dev/ultraviolet/dist/* public/uv/ || true
          cp -r node_modules/@mercuryworkshop/bare-mux/dist/* public/baremux/ || true
          cp -r node_modules/@mercuryworkshop/epoxy-transport/dist/* public/epoxy/ || true
          rm -f public/uv/uv.config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
